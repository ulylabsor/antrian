<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antrian Pengambilan Sertifikat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Background layer — the "spotlight" cross-fade -->
  <div id="peserta-bg" class="peserta-bg"></div>

  <!-- Screen: Cari Nama -->
  <div id="screen-cari" class="min-h-screen flex items-center justify-center p-4" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;">
    <div class="peserta-card" style="max-width:440px;">
      <div style="font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--ink); letter-spacing:-0.01em;">Pengambilan Sertifikat</div>
      <p style="color:var(--slate); font-size:14px; margin:6px 0 28px;">Cari nama Anda untuk mengambil nomor antrian</p>

      <label style="font-family:var(--font-display); font-size:10px; color:var(--slate-mute); font-weight:600; letter-spacing:2px; text-transform:uppercase; display:block; margin-bottom:8px;">Masukkan Nama</label>
      <input
        type="text"
        id="input-nama"
        class="search-input"
        placeholder="Ketik nama lengkap..."
        autocomplete="off"
      >

      <div id="hasil-pencarian" style="margin-top:10px; max-height:240px; overflow-y:auto;"></div>

      <div id="detail-peserta" style="margin-top:24px; display:none;">
        <!-- Diisi oleh JS -->
      </div>
    </div>
  </div>

  <!-- Screen: Nomor Antrian -->
  <div id="screen-antrian" style="min-height:100vh; display:none; align-items:center; justify-content:center; padding:16px;">
    <div id="peserta-card" class="peserta-card">
      <div class="eyebrow">Nomor Antrian Anda</div>
      <div id="nomor-antrian" class="queue-number">-</div>

      <!-- Loket display — hidden sampai dipanggil -->
      <div id="loket-box" class="loket-box" style="display:none;">
        <div class="label">Harap menuju ke</div>
        <div id="loket-number" class="value">Loket -</div>
      </div>

      <div id="status-box">
        <span id="status-badge" class="status-badge">
          <span id="status-dot" class="dot"></span><span id="status-label">Menunggu</span>
        </span>
      </div>

      <!-- Replay button — muncul saat dipanggil -->
      <button id="replay-btn" class="replay-btn" style="display:none;" onclick="panggilLagi()">
        🔔 Putar panggilan lagi
      </button>

      <div id="info-peserta" class="info-list">
        <!-- Diisi oleh JS -->
      </div>

      <p class="footnote">Status update otomatis — mohon tunggu di lokasi.</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/peserta.js"></script>
</body>
</html>
