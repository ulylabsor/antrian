<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informasi Antrian - Pengambilan Sertifikat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #070b16;
      --bg-2: #0d1424;
      --card: rgba(255,255,255,0.05);
      --card-border: rgba(255,255,255,0.1);
      --gold: #e8b04b;
      --gold-deep: #c99a3f;
      --gold-soft: rgba(232,176,75,0.15);
      --gold-line: rgba(232,176,75,0.4);
      --emerald: #34d399;
      --emerald-soft: rgba(52,211,153,0.15);
      --blue: #60a5fa;
      --blue-soft: rgba(96,165,250,0.15);
      --paper: #ffffff;
      --paper-dim: rgba(255,255,255,0.75);
      --paper-mute: rgba(255,255,255,0.45);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-body);
      background:
        radial-gradient(ellipse at 15% 20%, rgba(232,176,75,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(52,211,153,0.04) 0%, transparent 50%),
        linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Grid pattern background — subtle */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      padding: 8px 0 4px;
    }
    .header .eyebrow {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: -0.01em;
      margin-top: 4px;
    }

    /* ===== Stats bar ===== */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .stat-card .num {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .stat-card .num.gold { color: var(--gold); }
    .stat-card .num.emerald { color: var(--emerald); }
    .stat-card .num.blue { color: var(--blue); }
    .stat-card .num.paper { color: var(--paper-dim); }
    .stat-card .lbl {
      font-family: var(--font-body);
      font-size: 9px;
      color: var(--paper-mute);
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ===== Hero — Sedang Dipanggil ===== */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 8px 0;
    }
    .hero-card {
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 48px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
      max-width: 520px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
    }
    .hero-card .label {
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--paper-mute);
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .hero-card .nomor {
      font-family: var(--font-display);
      font-size: 110px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      letter-spacing: -0.03em;
      margin: 10px 0 14px;
      text-shadow: 0 0 50px rgba(232,176,75,0.35);
      animation: nomor-glow 3s ease-in-out infinite;
    }
    .hero-card .counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gold-soft);
      color: var(--gold);
      padding: 8px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid var(--gold-line);
    }
    .hero-card .nama {
      margin-top: 14px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--paper);
    }
    .hero-empty {
      color: var(--paper-mute);
      font-family: var(--font-display);
      font-size: 18px;
      text-align: center;
      line-height: 1.6;
    }

    /* ===== Two columns ===== */
    .two-col {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .next-section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
    }
    .next-title {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--paper-mute);
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .next-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 200px;
    }
    .next-list::-webkit-scrollbar { width: 4px; }
    .next-list::-webkit-scrollbar-track { background: transparent; }
    .next-list::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }
    .next-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .next-row .nomor {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--gold);
      min-width: 42px;
    }
    .next-row .info { flex: 1; min-width: 0; }
    .next-row .nama {
      font-weight: 600;
      color: var(--paper);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .next-row .seri {
      font-size: 10px;
      color: var(--paper-mute);
      margin-top: 1px;
      font-family: var(--font-body);
    }
    .next-empty {
      color: var(--paper-mute);
      text-align: center;
      padding: 16px;
      font-size: 13px;
    }

    .info-section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .info-title {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--paper-mute);
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info-item .icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .info-item .icon.gold { background: var(--gold-soft); color: var(--gold); }
    .info-item .icon.emerald { background: var(--emerald-soft); color: var(--emerald); }
    .info-item .icon.blue { background: var(--blue-soft); color: var(--blue); }
    .info-item .text { flex: 1; }
    .info-item .text .label {
      font-size: 9px;
      color: var(--paper-mute);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .info-item .text .value {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: var(--paper);
      margin-top: 1px;
    }
    .info-item .text .value.small {
      font-size: 12px;
      font-family: var(--font-body);
      font-weight: 600;
      color: var(--paper-dim);
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      padding: 4px 0;
      color: var(--paper-mute);
      font-size: 11px;
    }
    .footer .dot {
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--emerald);
      border-radius: 50%;
      margin-right: 6px;
      animation: dot-pulse 2s ease-in-out infinite;
    }

    /* ===== Animations ===== */
    @keyframes nomor-glow {
      0%, 100% { text-shadow: 0 0 50px rgba(232,176,75,0.35); opacity: 1; }
      50% { text-shadow: 0 0 80px rgba(232,176,75,0.6); opacity: 0.92; }
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 768px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
      .hero-card .nomor { font-size: 72px; }
      .hero-card { padding: 20px 24px; }
      .next-list { max-height: 120px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="eyebrow">Informasi Antrian</div>
      <h1>Pengambilan Sertifikat</h1>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="stats-bar" style="display:none;">
      <div class="stat-card">
        <div class="num paper" id="stat-total">0</div>
        <div class="lbl">Total</div>
      </div>
      <div class="stat-card">
        <div class="num gold" id="stat-dipanggil">0</div>
        <div class="lbl">Dipanggil</div>
      </div>
      <div class="stat-card">
        <div class="num blue" id="stat-menunggu">0</div>
        <div class="lbl">Menunggu</div>
      </div>
      <div class="stat-card">
        <div class="num emerald" id="stat-selesai">0</div>
        <div class="lbl">Selesai</div>
      </div>
    </div>

    <!-- Hero — Sedang Dipanggil -->
    <div class="hero">
      <div class="hero-card" id="hero-card" style="display:none;">
        <div class="label">Sedang Dipanggil</div>
        <div class="nomor" id="hero-nomor">-</div>
        <div class="counter" id="hero-counter">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
          <span id="hero-counter-text">Counter -</span>
        </div>
        <div class="nama" id="hero-nama"></div>
      </div>
      <div class="hero-empty" id="hero-empty">
        Belum ada peserta yang dipanggil.<br>Mohon menunggu.
      </div>
    </div>

    <!-- Two Columns -->
    <div class="two-col">

      <!-- Antrian Berikutnya -->
      <div class="next-section">
        <div class="next-title">Antrian Berikutnya</div>
        <div class="next-list" id="next-list">
          <div class="next-empty">Memuat data...</div>
        </div>
      </div>

      <!-- Info Section -->
      <div class="info-section">
        <div class="info-title">Informasi</div>
        <div class="info-list" id="info-list">
          <div class="info-item">
            <div class="icon gold">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </div>
            <div class="text">
              <div class="label">Estimasi Tunggu</div>
              <div class="value small" id="info-estimasi">-</div>
            </div>
          </div>
          <div class="info-item">
            <div class="icon blue">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="text">
              <div class="label">Sisa Antrian</div>
              <div class="value" id="info-sisa">-</div>
            </div>
          </div>
          <div class="info-item">
            <div class="icon emerald">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="text">
              <div class="label">Selesai</div>
              <div class="value" id="info-selesai">-</div>
            </div>
          </div>
          <div class="info-item">
            <div class="icon gold">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
            </div>
            <div class="text">
              <div class="label">Counter Aktif</div>
              <div class="value" id="info-counter">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="dot"></span>Update otomatis — real-time
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function estimasiTunggu(menunggu) {
      if (!menunggu || menunggu === 0) return 'Tidak ada';
      const menit = menunggu * 2;
      if (menit < 60) return `± ${menit} menit`;
      const jam = Math.floor(menit / 60);
      const sisa = menit % 60;
      return sisa > 0 ? `± ${jam}j ${sisa}m` : `± ${jam} jam`;
    }

    async function loadInfo() {
      try {
        const res = await fetch('/api/info-antrian');
        const data = await res.json();
        renderHero(data.dipanggil);
        renderNext(data.menunggu);
        renderStats(data.statistik);
        renderInfo(data.statistik);
      } catch (err) {
        console.error('Gagal memuat info antrian:', err);
      }
    }

    function renderHero(dipanggil) {
      const heroCard = document.getElementById('hero-card');
      const heroEmpty = document.getElementById('hero-empty');
      if (dipanggil && dipanggil.length > 0) {
        const current = dipanggil[dipanggil.length - 1];
        document.getElementById('hero-nomor').textContent = current.nomor_antrian;
        document.getElementById('hero-counter-text').textContent = current.counter ? `Counter ${current.counter}` : 'Counter';
        document.getElementById('hero-nama').textContent = current.nama_lengkap;
        heroCard.style.display = 'block';
        heroEmpty.style.display = 'none';
      } else {
        heroCard.style.display = 'none';
        heroEmpty.style.display = 'block';
      }
    }

    function renderNext(menunggu) {
      const list = document.getElementById('next-list');
      if (!menunggu || menunggu.length === 0) {
        list.innerHTML = '<div class="next-empty">Tidak ada antrian</div>';
        return;
      }
      list.innerHTML = menunggu.map(p => `
        <div class="next-row">
          <div class="nomor">#${esc(p.nomor_antrian)}</div>
          <div class="info">
            <div class="nama">${esc(p.nama_lengkap)}</div>
            <div class="seri">${esc(p.no_seri)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderStats(statistik) {
      if (!statistik) return;
      const total = (statistik.menunggu ?? 0) + (statistik.dipanggil ?? 0) + (statistik.selesai ?? 0);
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-dipanggil').textContent = statistik.dipanggil ?? 0;
      document.getElementById('stat-menunggu').textContent = statistik.menunggu ?? 0;
      document.getElementById('stat-selesai').textContent = statistik.selesai ?? 0;
      document.getElementById('stats-bar').style.display = 'grid';
    }

    function renderInfo(statistik) {
      if (!statistik) return;
      document.getElementById('info-estimasi').textContent = estimasiTunggu(statistik.menunggu ?? 0);
      document.getElementById('info-sisa').textContent = statistik.menunggu ?? 0;
      document.getElementById('info-selesai').textContent = statistik.selesai ?? 0;
      const counterAktif = statistik.dipanggil ?? 0;
      document.getElementById('info-counter').textContent = counterAktif > 0 ? `${counterAktif}` : '0';
    }

    socket.on('antrian:panggil', () => { loadInfo(); });
    socket.on('antrian:baru', () => { loadInfo(); });
    socket.on('antrian:selesai', () => { loadInfo(); });
    socket.on('antrian:panggil-ulang', () => { loadInfo(); });
    socket.on('statistik:update', () => { loadInfo(); });

    loadInfo();
    setInterval(loadInfo, 15000);
  </script>
</body>
</html>
