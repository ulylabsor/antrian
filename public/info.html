<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informasi Antrian - Pengambilan Sertifikat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0a0f1e;
      --bg-2: #111a2e;
      --card: rgba(255,255,255,0.05);
      --card-border: rgba(255,255,255,0.1);
      --gold: #e8b04b;
      --gold-deep: #c99a3f;
      --gold-soft: rgba(232,176,75,0.15);
      --gold-line: rgba(232,176,75,0.4);
      --paper: #ffffff;
      --paper-dim: rgba(255,255,255,0.75);
      --paper-mute: rgba(255,255,255,0.45);
      --emerald: #34d399;
      --emerald-soft: rgba(52,211,153,0.15);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background:
        radial-gradient(ellipse at 20% 10%, rgba(232,176,75,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(52,211,153,0.04) 0%, transparent 50%),
        linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--paper);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      padding: 36px 24px 20px;
    }
    .header .eyebrow {
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: -0.01em;
      margin-top: 8px;
    }
    .header .sub {
      color: var(--paper-mute);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 400;
    }
    .header .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
      margin: 20px auto 0;
    }

    /* ===== Progress bar ===== */
    .progress-wrap {
      padding: 0 40px;
      margin: 20px auto 0;
      max-width: 560px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--paper-mute);
      margin-bottom: 8px;
    }
    .progress-label .strong {
      color: var(--gold);
      font-weight: 600;
    }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--emerald));
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    /* ===== Hero — Sedang Dipanggil ===== */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      min-height: 46vh;
    }
    .hero-card {
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 56px 72px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 40px 100px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
      max-width: 640px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
    }
    .hero-card .label {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--paper-mute);
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .hero-card .nomor {
      font-family: var(--font-body);
      font-size: 180px;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      letter-spacing: -0.05em;
      margin: 20px 0 24px;
      text-shadow: 0 0 60px rgba(232,176,75,0.4);
      animation: nomor-glow 3s ease-in-out infinite;
    }
    .hero-card .counter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold-soft);
      color: var(--gold);
      padding: 12px 32px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.5px;
      border: 1px solid var(--gold-line);
    }
    .hero-card .nama {
      margin-top: 24px;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      color: var(--paper);
    }
    .hero-empty {
      color: var(--paper-mute);
      font-family: var(--font-display);
      font-size: 24px;
      text-align: center;
      line-height: 1.6;
    }
    .hero-empty .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* ===== Antrian Berikutnya ===== */
    .next-section {
      padding: 24px 40px 48px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .next-title {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--paper-mute);
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 20px;
    }
    .next-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .next-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .next-row:hover {
      border-color: var(--gold-line);
      transform: translateY(-2px);
    }
    .next-row .nomor {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 800;
      color: var(--gold);
      min-width: 56px;
      letter-spacing: -0.02em;
    }
    .next-row .info { flex: 1; min-width: 0; }
    .next-row .nama {
      font-weight: 600;
      color: var(--paper);
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .next-row .seri {
      font-size: 12px;
      color: var(--paper-mute);
      margin-top: 2px;
    }
    .next-empty {
      grid-column: 1 / -1;
      color: var(--paper-mute);
      text-align: center;
      padding: 32px;
      font-size: 15px;
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      padding: 20px 24px 32px;
      color: var(--paper-mute);
      font-size: 12px;
    }
    .footer .dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--emerald);
      border-radius: 50%;
      margin-right: 8px;
      animation: dot-pulse 2s ease-in-out infinite;
    }

    /* ===== Animations ===== */
    @keyframes nomor-glow {
      0%, 100% { text-shadow: 0 0 60px rgba(232,176,75,0.4); opacity: 1; }
      50% { text-shadow: 0 0 90px rgba(232,176,75,0.7); opacity: 0.92; }
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 640px) {
      .hero-card .nomor { font-size: 110px; }
      .hero-card { padding: 36px 28px; }
      .header h1 { font-size: 26px; }
      .next-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="eyebrow">Informasi Antrian</div>
    <h1>Pengambilan Sertifikat</h1>
    <div class="sub">Mohon perhatikan nomor antrian Anda</div>
    <div class="divider"></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap" style="display:none;">
    <div class="progress-label">
      <span>Progres pengambilan</span>
      <span class="strong" id="progress-text">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Hero — Sedang Dipanggil -->
  <div class="hero">
    <div class="hero-card" id="hero-card" style="display:none;">
      <div class="label">Sedang Dipanggil</div>
      <div class="nomor" id="hero-nomor">-</div>
      <div class="counter" id="hero-counter">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
        <span id="hero-counter-text">Counter -</span>
      </div>
      <div class="nama" id="hero-nama"></div>
    </div>
    <div class="hero-empty" id="hero-empty">
      <div class="icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      Belum ada peserta yang dipanggil.<br>Mohon menunggu dengan sabar.
    </div>
  </div>

  <!-- Antrian Berikutnya -->
  <div class="next-section">
    <div class="next-title">Antrian Berikutnya</div>
    <div class="next-grid" id="next-grid">
      <div class="next-empty">Memuat data...</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="dot"></span>Update otomatis — informasi antrian real-time
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function loadInfo() {
      try {
        const res = await fetch('/api/info-antrian');
        const data = await res.json();
        renderHero(data.dipanggil);
        renderNext(data.menunggu);
        renderProgress(data.statistik);
      } catch (err) {
        console.error('Gagal memuat info antrian:', err);
      }
    }

    function renderHero(dipanggil) {
      const heroCard = document.getElementById('hero-card');
      const heroEmpty = document.getElementById('hero-empty');
      if (dipanggil && dipanggil.length > 0) {
        const current = dipanggil[dipanggil.length - 1];
        document.getElementById('hero-nomor').textContent = current.nomor_antrian;
        document.getElementById('hero-counter-text').textContent = current.counter ? `Counter ${current.counter}` : 'Counter';
        document.getElementById('hero-nama').textContent = current.nama_lengkap;
        heroCard.style.display = 'block';
        heroEmpty.style.display = 'none';
      } else {
        heroCard.style.display = 'none';
        heroEmpty.style.display = 'block';
      }
    }

    function renderNext(menunggu) {
      const grid = document.getElementById('next-grid');
      if (!menunggu || menunggu.length === 0) {
        grid.innerHTML = '<div class="next-empty">Tidak ada antrian menunggu</div>';
        return;
      }
      grid.innerHTML = menunggu.map(p => `
        <div class="next-row">
          <div class="nomor">#${esc(p.nomor_antrian)}</div>
          <div class="info">
            <div class="nama">${esc(p.nama_lengkap)}</div>
            <div class="seri">${esc(p.no_seri)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderProgress(statistik) {
      if (!statistik) return;
      const total = (statistik.menunggu ?? 0) + (statistik.dipanggil ?? 0) + (statistik.selesai ?? 0);
      if (total === 0) return;
      const selesai = statistik.selesai ?? 0;
      const pct = Math.round((selesai / total) * 100);
      document.getElementById('progress-text').textContent = `${selesai} / ${total} (${pct}%)`;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-wrap').style.display = 'block';
    }

    // Real-time update
    socket.on('antrian:panggil', () => { loadInfo(); });
    socket.on('antrian:baru', () => { loadInfo(); });
    socket.on('antrian:selesai', () => { loadInfo(); });
    socket.on('antrian:panggil-ulang', () => { loadInfo(); });
    socket.on('statistik:update', () => { loadInfo(); });

    // Init
    loadInfo();
    setInterval(loadInfo, 15000);
  </script>
</body>
</html>
