<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informasi Antrian - Pengambilan Sertifikat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --ink-2: #1e293b;
      --paper: #ffffff;
      --mist: #f1f5f9;
      --mist-2: #e2e8f0;
      --slate: #475569;
      --slate-mute: #94a3b8;
      --gold: #b45309;
      --gold-deep: #92400e;
      --gold-soft: #fef3c7;
      --gold-line: #fde68a;
      --gold-glow: rgba(180, 83, 9, 0.25);
      --emerald: #059669;
      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: linear-gradient(165deg, var(--ink) 0%, var(--ink-2) 100%);
      color: var(--paper);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      padding: 32px 24px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header .eyebrow {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--gold-soft);
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: -0.01em;
      margin-top: 6px;
    }
    .header .sub {
      color: var(--slate-mute);
      font-size: 14px;
      margin-top: 4px;
    }

    /* ===== Sedang Dipanggil — the hero ===== */
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      min-height: 42vh;
    }
    .hero-card {
      background: var(--paper);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 32px 80px -16px rgba(0,0,0,0.6);
      border: 1px solid var(--gold-line);
      animation: hero-glow 3s ease-in-out infinite;
      max-width: 560px;
      width: 100%;
    }
    .hero-card .label {
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--slate-mute);
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .hero-card .nomor {
      font-family: var(--font-body);
      font-size: 120px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      letter-spacing: -0.04em;
      margin: 16px 0;
      animation: nomor-pulse 2.5s ease-in-out infinite;
    }
    .hero-card .counter {
      display: inline-block;
      background: linear-gradient(135deg, #fffbeb, var(--gold-soft));
      color: var(--gold-deep);
      padding: 10px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      border: 1px solid var(--gold-line);
      margin-top: 8px;
    }
    .hero-card .nama {
      margin-top: 20px;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .hero-empty {
      color: var(--slate-mute);
      font-family: var(--font-display);
      font-size: 22px;
      text-align: center;
      padding: 48px 24px;
    }

    /* ===== Antrian Berikutnya ===== */
    .next-section {
      padding: 24px 32px 40px;
      max-width: 720px;
      margin: 0 auto;
    }
    .next-section .section-title {
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--slate-mute);
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 18px;
    }
    .next-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .next-row {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 20px;
      backdrop-filter: blur(8px);
    }
    .next-row .nomor {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 800;
      color: var(--gold-soft);
      width: 56px;
      letter-spacing: -0.02em;
    }
    .next-row .nama {
      font-weight: 600;
      color: var(--paper);
      font-size: 15px;
      flex: 1;
    }
    .next-row .seri {
      font-size: 12px;
      color: var(--slate-mute);
    }
    .next-empty {
      color: var(--slate-mute);
      text-align: center;
      padding: 24px;
      font-size: 14px;
    }

    /* ===== Footer statistik ===== */
    .footer-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 24px 32px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .stat {
      text-align: center;
    }
    .stat .num {
      font-family: var(--font-body);
      font-size: 28px;
      font-weight: 800;
      color: var(--gold-soft);
      letter-spacing: -0.02em;
    }
    .stat .lbl {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--slate-mute);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ===== Animations ===== */
    @keyframes hero-glow {
      0%, 100% { box-shadow: 0 32px 80px -16px rgba(0,0,0,0.6), 0 0 0 0 rgba(180,83,9,0); }
      50% { box-shadow: 0 32px 80px -16px rgba(0,0,0,0.6), 0 0 40px 0 var(--gold-glow); }
    }
    @keyframes nomor-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.02); }
    }

    @media (max-width: 640px) {
      .hero-card .nomor { font-size: 80px; }
      .hero-card { padding: 32px 24px; }
      .header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="eyebrow">Informasi Antrian</div>
    <h1>Pengambilan Sertifikat</h1>
    <div class="sub">Status antrian saat ini</div>
  </div>

  <!-- Sedang Dipanggil -->
  <div class="hero" id="hero">
    <div class="hero-card" id="hero-card" style="display:none;">
      <div class="label">Sedang Dipanggil</div>
      <div class="nomor" id="hero-nomor">-</div>
      <div class="counter" id="hero-counter">Counter -</div>
      <div class="nama" id="hero-nama"></div>
    </div>
    <div class="hero-empty" id="hero-empty">
      Belum ada peserta yang dipanggil.<br>Mohon menunggu.
    </div>
  </div>

  <!-- Antrian Berikutnya -->
  <div class="next-section">
    <div class="section-title">Antrian Berikutnya</div>
    <div class="next-list" id="next-list">
      <div class="next-empty">Memuat data...</div>
    </div>
  </div>

  <!-- Footer Statistik -->
  <div class="footer-stats" id="footer-stats" style="display:none;">
    <div class="stat">
      <div class="num" id="stat-menunggu">0</div>
      <div class="lbl">Menunggu</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-dipanggil">0</div>
      <div class="lbl">Dipanggil</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-selesai">0</div>
      <div class="lbl">Selesai</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function loadInfo() {
      try {
        const res = await fetch('/api/info-antrian');
        const data = await res.json();
        renderHero(data.dipanggil);
        renderNext(data.menunggu);
        renderStats(data.statistik);
      } catch (err) {
        console.error('Gagal memuat info antrian:', err);
      }
    }

    function renderHero(dipanggil) {
      const heroCard = document.getElementById('hero-card');
      const heroEmpty = document.getElementById('hero-empty');
      if (dipanggil && dipanggil.length > 0) {
        // Tampilkan yang terakhir dipanggil (nomor terbesar = yang paling baru)
        const current = dipanggil[dipanggil.length - 1];
        document.getElementById('hero-nomor').textContent = current.nomor_antrian;
        document.getElementById('hero-counter').textContent = current.counter ? `Counter ${current.counter}` : 'Counter';
        document.getElementById('hero-nama').textContent = current.nama_lengkap;
        heroCard.style.display = 'block';
        heroEmpty.style.display = 'none';
      } else {
        heroCard.style.display = 'none';
        heroEmpty.style.display = 'block';
      }
    }

    function renderNext(menunggu) {
      const list = document.getElementById('next-list');
      if (!menunggu || menunggu.length === 0) {
        list.innerHTML = '<div class="next-empty">Tidak ada antrian menunggu</div>';
        return;
      }
      list.innerHTML = menunggu.map(p => `
        <div class="next-row">
          <div class="nomor">#${esc(p.nomor_antrian)}</div>
          <div class="nama">${esc(p.nama_lengkap)}</div>
          <div class="seri">${esc(p.no_seri)}</div>
        </div>
      `).join('');
    }

    function renderStats(statistik) {
      if (!statistik) return;
      document.getElementById('stat-menunggu').textContent = statistik.menunggu ?? 0;
      document.getElementById('stat-dipanggil').textContent = statistik.dipanggil ?? 0;
      document.getElementById('stat-selesai').textContent = statistik.selesai ?? 0;
      document.getElementById('footer-stats').style.display = 'flex';
    }

    // Real-time update
    socket.on('antrian:panggil', () => { loadInfo(); });
    socket.on('antrian:baru', () => { loadInfo(); });
    socket.on('antrian:selesai', () => { loadInfo(); });
    socket.on('antrian:panggil-ulang', () => { loadInfo(); });
    socket.on('statistik:update', () => { loadInfo(); });

    // Init
    loadInfo();
    // Refresh berkala sebagai fallback
    setInterval(loadInfo, 15000);
  </script>
</body>
</html>
