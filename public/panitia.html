<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Panitia — Antrian Sertifikat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ===== Design tokens (shared with index.html + info.html) ===== */
    :root, [data-theme="dark"] {
      --bg-1: #060912;
      --bg-2: #0c1322;
      --bg-3: #111a2e;
      --card: rgba(255,255,255,0.045);
      --card-hover: rgba(255,255,255,0.075);
      --card-strong: rgba(255,255,255,0.09);
      --card-border: rgba(255,255,255,0.09);
      --card-border-strong: rgba(255,255,255,0.16);
      --hairline: rgba(255,255,255,0.06);

      --gold: #e8b04b;
      --gold-bright: #f3c869;
      --gold-deep: #c99a3f;
      --gold-soft: rgba(232,176,75,0.14);
      --gold-line: rgba(232,176,75,0.38);
      --gold-glow: rgba(232,176,75,0.28);

      --emerald: #34d399;
      --emerald-soft: rgba(52,211,153,0.14);
      --emerald-line: rgba(52,211,153,0.35);

      --blue: #60a5fa;
      --blue-soft: rgba(96,165,250,0.14);

      --rose: #fb7185;
      --rose-soft: rgba(251,113,133,0.14);

      --paper: #ffffff;
      --paper-dim: rgba(255,255,255,0.72);
      --paper-mute: rgba(255,255,255,0.42);
      --paper-faint: rgba(255,255,255,0.22);

      --shadow-card: 0 24px 60px -28px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
      --shadow-hero: 0 40px 100px -30px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.06);

      --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    [data-theme="light"] {
      --bg-1: #eef2f7;
      --bg-2: #e2e8f0;
      --bg-3: #d9e2ec;
      --card: rgba(15,23,42,0.045);
      --card-hover: rgba(15,23,42,0.07);
      --card-strong: rgba(15,23,42,0.08);
      --card-border: rgba(15,23,42,0.1);
      --card-border-strong: rgba(15,23,42,0.18);
      --hairline: rgba(15,23,42,0.07);

      --gold: #b45309;
      --gold-bright: #d97706;
      --gold-deep: #92400e;
      --gold-soft: rgba(180,83,9,0.12);
      --gold-line: rgba(180,83,9,0.32);
      --gold-glow: rgba(180,83,9,0.18);

      --emerald: #059669;
      --emerald-soft: rgba(5,150,105,0.12);
      --emerald-line: rgba(5,150,105,0.3);

      --blue: #2563eb;
      --blue-soft: rgba(37,99,235,0.1);

      --rose: #e11d48;
      --rose-soft: rgba(225,29,72,0.1);

      --paper: #0f172a;
      --paper-dim: rgba(15,23,42,0.74);
      --paper-mute: rgba(15,23,42,0.5);
      --paper-faint: rgba(15,23,42,0.28);

      --shadow-card: 0 18px 40px -24px rgba(15,23,42,0.25), inset 0 1px 0 rgba(255,255,255,0.6);
      --shadow-hero: 0 30px 70px -30px rgba(15,23,42,0.28), inset 0 1px 0 rgba(255,255,255,0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background:
        radial-gradient(ellipse 60% 50% at 12% 12%, var(--gold-soft) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 88% 88%, var(--emerald-soft) 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 50% 50%, var(--bg-3) 0%, transparent 70%),
        linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--paper);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.5s ease, color 0.4s ease;
    }

    /* Subtle grid backdrop */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--hairline) 1px, transparent 1px),
        linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .page { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; }

    /* ===== Top bar (shared with index.html + info.html) ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 24px; max-width: 1200px; margin: 0 auto; width: 100%;
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand .mark {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(145deg, var(--gold-soft), transparent);
      border: 1px solid var(--gold-line);
      display: flex; align-items: center; justify-content: center;
      color: var(--gold); flex-shrink: 0;
      box-shadow: inset 0 0 20px var(--gold-soft);
    }
    .brand .eyebrow {
      font-family: var(--font-display); font-size: 11px; color: var(--gold);
      font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
    }
    .brand h1 {
      font-family: var(--font-display); font-size: 20px; font-weight: 700;
      color: var(--paper); letter-spacing: -0.01em; line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Logo institusi UIN Raden Fatah Palembang + logo PPG berdampingan */
    .brand .brand-logos {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .brand .brand-logo {
      width: 42px; height: 42px; border-radius: 11px;
      background: #fff; border: 1px solid var(--gold-line);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
      box-shadow: inset 0 0 20px var(--gold-soft);
    }
    .brand .brand-logo img {
      width: 100%; height: 100%; object-fit: contain; padding: 3px;
    }
    /* Logo PPG: bentuk landscape (rasio ~3.7:1) — tanpa kotak putih, biarkan gambar tampil apa adanya. */
    .brand .brand-logo.ppg { width: 156px; height: 42px; background: transparent; border: none; box-shadow: none; border-radius: 0; }
    .brand .brand-logo.ppg img { padding: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.18)); }
    /* Baris nama institusi di bawah h1 */
    .brand .brand-sub {
      font-family: var(--font-display); font-size: 10.5px; font-weight: 600;
      color: var(--paper-mute); letter-spacing: 0.5px;
      margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .clock { display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .clock .time {
      font-family: var(--font-mono); font-size: 20px; font-weight: 700;
      color: var(--paper); font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
    }
    .clock .date {
      font-size: 11px; color: var(--paper-mute); font-weight: 600;
      letter-spacing: 0.5px; margin-top: 4px; text-transform: capitalize;
    }
    .theme-toggle {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 999px; padding: 8px 14px; display: flex; align-items: center;
      gap: 8px; cursor: pointer; color: var(--paper-dim); font-size: 12px;
      font-weight: 600; backdrop-filter: blur(8px); flex-shrink: 0;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
      font-family: var(--font-body);
    }
    .theme-toggle:hover { border-color: var(--gold-line); color: var(--paper); }
    .theme-toggle:active { transform: scale(0.96); }
    .theme-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* ===== Page content wrapper ===== */
    .content { max-width: 1200px; width: 100%; margin: 0 auto; padding: 4px 24px 36px; z-index: 1; }

    /* ===== Glass cards ===== */
    .panel-card {
      background: linear-gradient(165deg, var(--card-strong), var(--card));
      border: 1px solid var(--card-border-strong);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      padding: 20px 22px;
      margin-bottom: 16px;
    }

    /* ===== Toolbar ===== */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .tool-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tool-label { font-size: 13px; color: var(--paper-mute); font-weight: 600; }

    .loket-select {
      background: var(--card-hover); color: var(--paper);
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 8px 34px 8px 12px; font-family: var(--font-body); font-size: 14px;
      font-weight: 600; cursor: pointer;
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23e8b04b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .loket-select:hover { border-color: var(--card-border-strong); }
    .loket-select:focus-visible { outline: none; border-color: var(--gold-line); box-shadow: 0 0 0 3px var(--gold-soft); }
    .loket-select option { background: var(--bg-2); color: var(--paper); }

    .btn-tool {
      background: var(--card); color: var(--paper-dim);
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }
    .btn-tool:hover { border-color: var(--card-border-strong); color: var(--paper); background: var(--card-hover); }
    .btn-tool:active { transform: scale(0.96); }
    .btn-tool:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-tool.gold {
      background: linear-gradient(145deg, var(--gold-bright), var(--gold-deep));
      color: #fff; border-color: var(--gold-deep);
    }
    .btn-tool.gold:hover { filter: brightness(1.08); color: #fff; }

    .btn-sync {
      background: var(--emerald); color: #fff;
      border: 1px solid var(--emerald); border-radius: 10px;
      padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: filter 0.2s ease, transform 0.15s ease;
    }
    .btn-sync:hover { filter: brightness(1.08); }
    .btn-sync:active { transform: scale(0.96); }
    .btn-sync:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-sync:disabled { opacity: 0.6; cursor: wait; }

    /* ===== Settings panel ===== */
    #panel-settings { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--card-border); }
    .settings-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .input-loket {
      width: 84px; background: var(--card-hover); color: var(--paper);
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 8px 12px; font-family: var(--font-mono); font-size: 14px; font-weight: 600;
    }
    .input-loket:focus-visible { outline: none; border-color: var(--gold-line); box-shadow: 0 0 0 3px var(--gold-soft); }
    .btn-save {
      background: linear-gradient(145deg, var(--gold-bright), var(--gold-deep));
      color: #fff; border: none; border-radius: 10px;
      padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .btn-save:hover { box-shadow: 0 6px 20px -8px var(--gold-glow); transform: translateY(-1px); }
    .btn-save:active { transform: scale(0.96); }
    .btn-save:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .settings-status { font-size: 12px; color: var(--paper-mute); font-weight: 600; }
    .settings-status.is-ok { color: var(--emerald); }
    .settings-status.is-error { color: var(--rose); }

    /* ===== Statistik grid ===== */
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    @media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card {
      background: linear-gradient(165deg, var(--card-strong), var(--card));
      border: 1px solid var(--card-border); border-radius: 16px;
      padding: 16px 14px; text-align: center;
      box-shadow: var(--shadow-card);
    }
    .stat-label { font-size: 12px; color: var(--paper-mute); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
    .stat-value {
      font-family: var(--font-display); font-size: 32px; font-weight: 800;
      color: var(--paper); margin-top: 6px; font-variant-numeric: tabular-nums; line-height: 1;
    }
    .stat-value.gold { color: var(--gold); }
    .stat-value.emerald { color: var(--emerald); }
    .stat-value.blue { color: var(--blue); }

    /* ===== Daftar antrian card ===== */
    .daftar-card { padding: 22px 24px; }
    .daftar-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .daftar-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--paper); }
    .daftar-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-input {
      background: var(--card-hover); color: var(--paper);
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 8px 12px; font-size: 14px; font-family: var(--font-body);
      width: 220px; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-input::placeholder { color: var(--paper-mute); }
    .search-input:focus-visible { outline: none; border-color: var(--gold-line); box-shadow: 0 0 0 3px var(--gold-soft); }

    /* ===== Tab bar ===== */
    .tab-bar { display: flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; }
    .tab-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      background: transparent; border: 1px solid transparent;
      color: var(--paper-mute); transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .tab-btn:hover { color: var(--paper-dim); background: var(--card-hover); }
    .tab-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .tab-count {
      font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
      background: var(--card-hover); color: var(--paper-mute);
      font-variant-numeric: tabular-nums; min-width: 18px; text-align: center;
    }
    /* Active tab tints by ID */
    #tab-menunggu.active { background: var(--gold-soft); border-color: var(--gold-line); color: var(--gold-bright); }
    #tab-menunggu.active .tab-count { background: rgba(232,176,75,0.25); color: var(--gold-bright); }
    #tab-dipanggil.active { background: var(--emerald-soft); border-color: var(--emerald-line); color: var(--emerald); }
    #tab-dipanggil.active .tab-count { background: rgba(52,211,153,0.25); color: var(--emerald); }
    #tab-selesai.active { background: var(--blue-soft); border-color: rgba(96,165,250,0.38); color: var(--blue); }
    #tab-selesai.active .tab-count { background: rgba(96,165,250,0.25); color: var(--blue); }

    /* ===== Queue list ===== */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .list-row {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 12px 14px; border-radius: 12px;
      background: var(--card-hover); border: 1px solid var(--card-border);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .list-row:hover { background: var(--card-strong); border-color: var(--card-border-strong); }
    .list-main { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .list-num {
      font-family: var(--font-mono); font-size: 24px; font-weight: 800;
      color: var(--gold); width: 52px; flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .list-info { min-width: 0; }
    .list-name { font-size: 15px; font-weight: 700; color: var(--paper); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .seri-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .seri-label { font-size: 11px; color: var(--paper-mute); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .seri-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--blue-soft); border: 1px solid var(--blue);
      border-radius: 6px; padding: 2px 8px;
      font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--blue);
      letter-spacing: 0.04em; user-select: all;
    }
    /* Zona tengah no seri untuk tab Menunggu & Dipanggil — font besar, di tengah baris */
    .list-row.has-seri-center { /* layout 3-zona: list-main | seri-center | list-actions */ }
    .seri-center {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      margin: 0 auto; padding: 0 8px; justify-content: center;
    }
    .seri-center .seri-label {
      font-size: 10px; color: var(--paper-mute); font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .seri-center .seri-badge {
      font-size: 17px; padding: 4px 14px; border-radius: 8px;
      letter-spacing: 0.06em;
    }
    .seri-center .copy-btn { width: 30px; height: 30px; }
    .copy-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; color: var(--blue);
      background: var(--blue-soft); border: 1px solid transparent; border-radius: 6px; cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .copy-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
    .copy-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .copy-btn.copied { color: #fff; background: var(--emerald); border-color: var(--emerald); }

    .meta-line { font-size: 11px; color: var(--paper-mute); font-weight: 500; margin-top: 4px; }
    .meta-line.gold { color: var(--gold); }

    .list-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    /* Meta kolom kanan untuk baris selesai (timelapse + waktu selesai) */
    .list-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; text-align: right; }
    .btn-action {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 9px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      border: 1px solid transparent; transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .btn-action:active { transform: scale(0.96); }
    .btn-action:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-action.primary {
      background: linear-gradient(145deg, var(--gold-bright), var(--gold-deep));
      color: #fff; border-color: var(--gold-deep);
    }
    .btn-action.primary:hover { box-shadow: 0 6px 18px -8px var(--gold-glow); transform: translateY(-1px); }
    .btn-action.emerald {
      background: var(--emerald); color: #fff; border-color: var(--emerald);
    }
    .btn-action.emerald:hover { background: var(--emerald); filter: brightness(1.08); transform: translateY(-1px); }
    .btn-action.amber {
      background: #f59e0b; color: #fff; border-color: #d97706;
    }
    .btn-action.amber:hover { background: #f59e0b; filter: brightness(1.08); transform: translateY(-1px); }
    /* Toggle berkas Siap/Belum di tab Menunggu — checklist panitia */
    .btn-action.berkas-siap {
      background: var(--card); color: var(--paper-mute);
      border-color: var(--card-border-strong);
    }
    .btn-action.berkas-siap:hover { background: var(--card-hover); color: var(--paper-dim); border-color: var(--card-border-strong); transform: translateY(-1px); }
    .btn-action.berkas-siap.is-on {
      background: var(--emerald); color: #fff; border-color: var(--emerald);
    }
    .btn-action.berkas-siap.is-on:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .counter-badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 6px;
      background: var(--emerald); border: 1px solid var(--emerald);
      color: #fff; font-size: 11px; font-weight: 700; margin-left: 4px;
    }

    .selesai-tag {
      display: inline-block; font-size: 11px; font-weight: 600;
      color: #fff; background: var(--emerald);
      border: 1px solid var(--emerald); border-radius: 6px;
      padding: 2px 8px; margin-top: 4px;
    }

    .empty-state { text-align: center; padding: 20px; color: var(--paper-mute); font-size: 14px; }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .topbar { padding: 14px 16px; gap: 10px; }
      .brand h1 { font-size: 17px; }
      .clock .time { font-size: 17px; }
      .theme-toggle { padding: 7px 10px; }
      .theme-toggle .label-txt { display: none; }
      .content { padding: 4px 16px 28px; }
      .daftar-head { flex-direction: column; align-items: stretch; }
      .search-input { flex: 1; width: auto; }
      .list-row { flex-direction: column; align-items: flex-start; }
      .seri-center { align-self: center; margin: 4px 0; }
      .list-meta { align-self: flex-end; align-items: flex-end; }
      .list-num { width: auto; }
    }
    @media (max-width: 380px) {
      .brand .eyebrow { display: none; }
      .brand .brand-sub { display: none; }
      .brand .brand-logo { width: 34px; height: 34px; }
      .brand .brand-logo.ppg { width: 126px; height: 34px; }
      .brand .brand-logos { gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* ===== Auth modal (login + ganti password) ===== */
    @keyframes auth-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    /* Override .page { display:flex } (spesifisitas 0,1,0) yang mengalahkan
       UA [hidden] default — supaya #dash benar-benar tersembunyi sebelum login.
       Selektor #dash[hidden] (1,1,0) > .page (0,1,0). */
    #dash[hidden] { display: none; }
    #auth-overlay input::placeholder { color: var(--paper-faint); }
    #auth-overlay input:focus { border-color: var(--gold-line); }
    /* Background card login: var(--card) nyaris-transparan di kedua tema.
       Di atas scrim bg-black/60 mode terang → abu-gelap dgn teks gelap = tak terbaca.
       Override solid putih (mode terang) supaya teks kontras. Mode gelap tetap var(--card). */
    .auth-card { background: var(--card); }
    [data-theme="light"] .auth-card { background: #ffffff; }
    /* Logo PPG (banner ~3.7:1) jadi lebar di samping logo UIN; wrap supaya
       tidak overflow di layar sempit. */
    #auth-overlay .auth-card > div:first-child { flex-wrap: wrap; }
  </style>
</head>
<body>
  <div id="auth-overlay" class="fixed inset-0 z-[2000] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-md" role="dialog" aria-modal="true" aria-labelledby="auth-title"></div>
  <div class="page" id="dash" hidden>

    <!-- ===== Top bar ===== -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logos">
          <div class="brand-logo">
            <img src="logo-radenfatah.png" alt="Logo UIN Raden Fatah Palembang" width="42" height="42">
          </div>
          <div class="brand-logo ppg">
            <img src="ppg.png" alt="Logo PPG">
          </div>
        </div>
        <div class="text">
          <div class="eyebrow">Dashboard Panitia</div>
          <h1>Pengambilan Sertifikat</h1>
          <div class="brand-sub">PPG UIN Raden Fatah Palembang</div>
        </div>
      </div>

      <div class="clock" aria-label="Jam dan tanggal sekarang">
        <div class="time" id="clock-time">--:--:--</div>
        <div class="date" id="clock-date">—</div>
      </div>

      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema terang atau gelap">
        <span class="icon" id="theme-icon"></span>
        <span id="theme-text" class="label-txt">Mode Terang</span>
      </button>
    </header>

    <main class="content">

      <!-- ===== Toolbar ===== -->
      <section class="panel-card">
        <div class="toolbar">
          <div class="tool-group">
            <label class="tool-group" for="select-loket">
              <span class="tool-label">Saya di Ruangan:</span>
              <select id="select-loket" class="loket-select" aria-label="Pilih ruangan panitia">
                <!-- options diisi oleh JS -->
              </select>
            </label>
          </div>

          <div class="tool-group">
            <button id="btn-settings" class="btn-tool">Pengaturan</button>
            <a href="/data" class="btn-tool gold">Data Peserta</a>
            <button id="btn-sync" class="btn-sync">
              <span id="sync-icon">☁️</span> Sync Sheets
            </button>
          </div>
        </div>

        <!-- Settings panel (hidden by default) -->
        <div id="panel-settings" class="hidden">
          <div class="settings-row">
            <span class="tool-label">Jumlah Ruangan:</span>
            <input id="input-jumlah-loket" type="number" min="1" max="20" class="input-loket" aria-label="Jumlah ruangan">
            <button id="btn-simpan-loket" class="btn-save">Simpan</button>
            <span id="settings-status" class="settings-status"></span>
          </div>
          <div class="settings-row" style="margin-top:12px;">
            <button id="btn-change-password" class="btn-save" type="button">Ganti Password</button>
          </div>
        </div>
      </section>

      <!-- ===== Statistik ===== -->
      <section id="statistik" class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Total Antrian</div>
          <div id="stat-total" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Menunggu</div>
          <div id="stat-menunggu" class="stat-value gold">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Dipanggil</div>
          <div id="stat-dipanggil" class="stat-value emerald">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Selesai</div>
          <div id="stat-selesai" class="stat-value blue">0</div>
        </div>
      </section>

      <!-- ===== Daftar Antrian ===== -->
      <section class="panel-card daftar-card">
        <div class="daftar-head">
          <h2 class="daftar-title">Daftar Antrian</h2>
          <div class="daftar-controls">
            <input
              type="text"
              id="input-cari-antrian"
              class="search-input"
              placeholder="Cari nama / no seri..."
              autocomplete="off"
              aria-label="Cari antrian"
            >
            <div id="tab-bar" class="tab-bar">
              <button id="tab-menunggu" onclick="loadDaftar('menunggu')" class="tab-btn active">
                <span>Menunggu</span>
                <span id="tab-count-menunggu" class="tab-count">0</span>
              </button>
              <button id="tab-dipanggil" onclick="loadDaftar('dipanggil')" class="tab-btn">
                <span>Dipanggil</span>
                <span id="tab-count-dipanggil" class="tab-count">0</span>
              </button>
              <button id="tab-selesai" onclick="loadDaftar('selesai')" class="tab-btn">
                <span>Selesai</span>
                <span id="tab-count-selesai" class="tab-count">0</span>
              </button>
            </div>
          </div>
        </div>

        <div id="daftar-antrian" class="list">
          <p class="empty-state">Memuat data...</p>
        </div>
      </section>

    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    /* ===== Theme (shared key with index.html + info.html) ===== */
    const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    function updateThemeButton(theme) {
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (theme === 'dark') { text.textContent = 'Mode Terang'; icon.innerHTML = SUN; }
      else { text.textContent = 'Mode Gelap'; icon.innerHTML = MOON; }
    }
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('info-theme', next);
      updateThemeButton(next);
    }
    (function initTheme() {
      const saved = localStorage.getItem('info-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeButton(saved);
    })();

    /* ===== Live clock ===== */
    const timeFmt = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const dateFmt = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent = timeFmt.format(now);
      document.getElementById('clock-date').textContent = dateFmt.format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
  <script src="/js/modal.js"></script>
  <script src="/js/auth-panitia.js"></script>
  <script src="/js/panitia.js"></script>
</body>
</html>
