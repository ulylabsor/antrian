<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Panitia - Antrian Sertifikat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background:var(--mist); min-height:100vh;">

  <div style="max-width:960px; margin:0 auto; padding:16px;">
    <!-- Header -->
    <div class="dash-card" style="padding:24px; margin-bottom:16px;">
      <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px;">
        <div>
          <h1 class="dash-title" style="font-size:26px; letter-spacing:-0.01em;">Dashboard Panitia</h1>
          <p style="color:var(--slate); font-size:13px; margin-top:2px;">Antrian Pengambilan Sertifikat</p>
        </div>

        <div style="display:flex; align-items:center; gap:12px;">
          <label style="display:flex; align-items:center; gap:8px;">
            <span style="font-family:var(--font-display); font-size:10px; color:var(--slate-mute); font-weight:600; letter-spacing:2px; text-transform:uppercase;">Saya di</span>
            <select id="select-loket" class="loket-select"></select>
          </label>

          <button id="btn-settings" class="filter-pill" data-active="false">Pengaturan</button>
        </div>
      </div>

      <!-- Settings panel -->
      <div id="panel-settings" style="display:none; margin-top:20px; padding-top:20px; border-top:1px solid var(--mist);">
        <label style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <span style="font-family:var(--font-display); font-size:10px; color:var(--slate-mute); font-weight:600; letter-spacing:2px; text-transform:uppercase;">Jumlah Loket</span>
          <input id="input-jumlah-loket" type="number" min="1" max="20" style="width:70px; padding:8px 10px; border:1px solid var(--mist-2); border-radius:10px; font-family:var(--font-body); font-size:14px; color:var(--ink);">
          <button id="btn-simpan-loket" class="action-btn panggil" style="background:var(--ink);">Simpan</button>
          <span id="settings-status" style="font-size:12px; color:var(--slate-mute);"></span>
        </label>
      </div>
    </div>

    <!-- Statistik -->
    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:16px;" id="statistik-grid">
      <div class="stat-card">
        <div class="label">Total Antrian</div>
        <div id="stat-total" class="value is-total">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Menunggu</div>
        <div id="stat-menunggu" class="value is-menunggu">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Dipanggil</div>
        <div id="stat-dipanggil" class="value is-dipanggil">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Selesai</div>
        <div id="stat-selesai" class="value is-selesai">0</div>
      </div>
    </div>

    <!-- Filter & Daftar Antrian -->
    <div class="dash-card" style="padding:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px;">
        <h2 class="dash-title" style="font-size:18px;">Daftar Antrian</h2>
        <div style="display:flex; gap:8px;">
          <button onclick="loadDaftar('menunggu')" id="pill-menunggu" class="filter-pill" data-active="true">Menunggu</button>
          <button onclick="loadDaftar('dipanggil')" id="pill-dipanggil" class="filter-pill" data-active="false">Dipanggil</button>
          <button onclick="loadDaftar('selesai')" id="pill-selesai" class="filter-pill" data-active="false">Selesai</button>
        </div>
      </div>

      <div id="daftar-antrian" style="display:flex; flex-direction:column; gap:8px;">
        <p style="color:var(--slate-mute); text-align:center; padding:16px 0;">Memuat data...</p>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/panitia.js"></script>
</body>
</html>
