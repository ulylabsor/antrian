<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Panitia - Antrian Sertifikat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-6xl mx-auto p-4">
    <!-- Header -->
    <div class="bg-white rounded-xl shadow p-6 mb-4">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Dashboard Panitia</h1>
          <p class="text-gray-500 text-sm">Antrian Pengambilan Sertifikat</p>
        </div>

        <div class="flex items-center gap-3">
          <!-- Counter picker -->
          <label class="flex items-center gap-2">
            <span class="text-sm text-gray-600">Saya di Counter:</span>
            <select id="select-loket"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm font-semibold text-gray-800">
              <!-- options diisi oleh JS -->
            </select>
          </label>

          <!-- Settings toggle -->
          <button id="btn-settings"
                  class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg text-sm font-medium">
            Pengaturan
          </button>

          <!-- Link ke halaman data keseluruhan -->
          <a href="/data.html"
             class="px-3 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 rounded-lg text-sm font-medium">
            Data Peserta
          </a>

          <!-- Tombol sync ke Google Sheets -->
          <button id="btn-sync"
                  class="px-3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium flex items-center gap-1">
            <span id="sync-icon">☁️</span> Sync Sheets
          </button>
        </div>
      </div>

      <!-- Settings panel (hidden by default) -->
      <div id="panel-settings" class="hidden mt-4 pt-4 border-t border-gray-200">
        <label class="flex items-center gap-2">
          <span class="text-sm text-gray-600">Jumlah Counter:</span>
          <input id="input-jumlah-loket" type="number" min="1" max="20"
                 class="w-20 px-3 py-2 border border-gray-300 rounded-lg text-sm">
          <button id="btn-simpan-loket"
                  class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">
            Simpan
          </button>
          <span id="settings-status" class="text-xs text-gray-500"></span>
        </label>
      </div>
    </div>

    <!-- Statistik -->
    <div id="statistik" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <div class="text-sm text-gray-500">Total Antrian</div>
        <div id="stat-total" class="text-3xl font-bold text-gray-800">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <div class="text-sm text-gray-500">Menunggu</div>
        <div id="stat-menunggu" class="text-3xl font-bold text-yellow-600">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <div class="text-sm text-gray-500">Dipanggil</div>
        <div id="stat-dipanggil" class="text-3xl font-bold text-blue-600">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <div class="text-sm text-gray-500">Selesai</div>
        <div id="stat-selesai" class="text-3xl font-bold text-green-600">0</div>
      </div>
    </div>

    <!-- Filter & Daftar Antrian -->
    <div class="bg-white rounded-xl shadow p-6">
      <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
        <h2 class="text-lg font-bold text-gray-800">Daftar Antrian</h2>
        <div class="flex gap-2 items-center flex-wrap">
          <input
            type="text"
            id="input-cari-antrian"
            class="px-3 py-1 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Cari nama / no seri..."
            autocomplete="off"
          >
          <div class="flex gap-2">
            <button onclick="loadDaftar('menunggu')" class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-lg text-sm font-medium">Menunggu</button>
            <button onclick="loadDaftar('dipanggil')" class="px-3 py-1 bg-blue-100 text-blue-800 rounded-lg text-sm font-medium">Dipanggil</button>
            <button onclick="loadDaftar('selesai')" class="px-3 py-1 bg-green-100 text-green-800 rounded-lg text-sm font-medium">Selesai</button>
          </div>
        </div>
      </div>

      <div id="daftar-antrian" class="space-y-2">
        <p class="text-gray-400 text-center py-4">Memuat data...</p>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/panitia.js"></script>
</body>
</html>
